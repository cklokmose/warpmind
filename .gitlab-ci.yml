stages:
  - lint

# Run pipelines for merge requests and for the default branch, but never
# both a branch pipeline and an MR pipeline for the same commit.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - when: never

default:
  image: node:22-alpine
  interruptible: true

format:
  stage: lint
  cache:
    # package-lock.json is gitignored, so key the cache on package.json instead.
    key:
      files:
        - package.json
    paths:
      - node_modules/
  before_script:
    - npm install --no-audit --no-fund
  script:
    - npm run format:check
